name: Deploy 3ellwa.space

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a287b5112e47d5501d7eb24d0a8adf7e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CF_API_TOKEN."
            exit 1
          fi
      - name: Typecheck Worker and web app
        run: npm run typecheck
      - name: Run web tests
        run: npm run test:web
      - name: Build production web assets
        run: npm run build:web
      - name: Configure local-only integration credentials
        shell: bash
        run: |
          printf 'ADMIN_PASSWORD=%s\\nDISCORD_AUTH_WEBHOOK_URL=%s\\n' 'ci-only-test-password' 'http://127.0.0.1:9999/hook' > .dev.vars
      - name: Apply local D1 migrations
        run: npm run db:migrate:local
      - name: Run Worker integration suite
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --test-scheduled --ip 127.0.0.1 --port 8787 > /tmp/3ellwa-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/3ellwa-worker.log
            exit 1
          fi
          node scripts/auth-flow-test.mjs http://127.0.0.1:8787 'ci-only-test-password'
          node scripts/part4-test.mjs http://127.0.0.1:8787 'ci-only-test-password'
          node scripts/part5-test.mjs http://127.0.0.1:8787 'ci-only-test-password'
          node scripts/part6-test.mjs http://127.0.0.1:8787 'ci-only-test-password'
          node scripts/part7-test.mjs http://127.0.0.1:8787 'ci-only-test-password'
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
