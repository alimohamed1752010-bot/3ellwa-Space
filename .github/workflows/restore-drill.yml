name: Cloudflare backup restore drill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore latest backup into disposable D1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate backup credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CF_ACCOUNT_ID CF_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
      - name: Verify D1 restore and media mirror
        run: bash scripts/restore-drill.sh
